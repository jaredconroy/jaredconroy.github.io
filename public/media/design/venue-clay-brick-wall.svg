<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".18 .48" numOctaves="3" stitchTiles="stitch" seed="23"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .26 0 0 0 0 .18 0 0 0 0 .13 0 0 0 .25 -.035"/>
    </filter>
    <filter id="rough" x="-2%" y="-5%" width="104%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="6" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="brick" width="400" height="160" patternUnits="userSpaceOnUse">
      <path fill="#bfb6a7" d="M0 0h400v160H0z"/>
      <g filter="url(#rough)">
        <rect x="4" y="4" width="190" height="70" rx="3" fill="#cda18a"/>
        <rect x="202" y="4" width="194" height="70" rx="3" fill="#c49a82"/>
        <rect x="-96" y="84" width="190" height="70" rx="3" fill="#d3ab91"/>
        <rect x="102" y="84" width="192" height="70" rx="3" fill="#c69d87"/>
        <rect x="302" y="84" width="192" height="70" rx="3" fill="#d0a68d"/>
        <g fill="none" stroke-width="2">
          <path stroke="#f0d9c3" opacity=".55" d="M7 7h184M205 7h188M0 87h91m14 0h186m14 0h95"/>
          <path stroke="#665044" opacity=".22" d="M6 72h186M204 72h190M0 152h92m12 0h188m12 0h96"/>
        </g>
      </g>
    </pattern>
  </defs>
  <rect width="800" height="320" fill="url(#brick)"/>
  <rect width="800" height="320" filter="url(#grain)"/>
</svg>
